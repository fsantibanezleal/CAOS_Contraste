<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Evidence breaks at each handover between the model, the validation and the supervisor, and extra capital is held">
<title>Evidence breaks at each handover between the model, the validation and the supervisor, and extra capital is held</title>
<style>
/* The pain, as a sequence (8 s loop): the evidence leaves the model owners, breaks at the first handover, the second, a finding
   reaches the supervisor and the capital held climbs. The labels never move. Reduced motion shows the final frame. */
.pn-doc1 { animation: pn-doc1 8s ease-out infinite; }
.pn-doc2 { animation: pn-doc2 8s ease-out infinite; }
.pn-x1 { animation: pn-x1 8s ease-out infinite; }
.pn-x2 { animation: pn-x2 8s ease-out infinite; }
.pn-warn { animation: pn-warn 8s ease-out infinite; }
.pn-cap1 { animation: pn-cap1 8s ease-out infinite; }
.pn-cap2 { animation: pn-cap2 8s ease-out infinite; }
.pn-arrow { animation: pn-arrow 8s ease-out infinite; }
@keyframes pn-doc1 { 0% { opacity: 0; transform: translateX(-34px); } 6% { opacity: 1; transform: translateX(-34px); } 20%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
@keyframes pn-x1 { 0%, 20% { opacity: 0; } 26%, 90% { opacity: 1; } 100% { opacity: 0; } }
@keyframes pn-doc2 { 0%, 30% { opacity: 0; transform: translateX(-34px); } 36% { opacity: 1; transform: translateX(-34px); } 50%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
@keyframes pn-x2 { 0%, 50% { opacity: 0; } 56%, 90% { opacity: 1; } 100% { opacity: 0; } }
@keyframes pn-warn { 0%, 58% { opacity: 0; transform: translateY(-10px); } 66%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes pn-cap1 { 0%, 66% { opacity: 0; transform: translateY(22px); } 76%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes pn-cap2 { 0%, 74% { opacity: 0; transform: translateY(22px); } 84%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes pn-arrow { 0%, 80% { opacity: 0; transform: translateY(14px); } 88%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .pn-doc1, .pn-doc2, .pn-x1, .pn-x2, .pn-warn, .pn-cap1, .pn-cap2, .pn-arrow { animation: none; opacity: 1; transform: none; }
}
</style>
