<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="The people who decide and check models, and the four current approaches, each leaving a gap">
<title>The people who decide and check models, and the four current approaches, each leaving a gap</title>
<style>
/* The roles handing the evidence over (6 s loop): a document is lifted at each role in turn, from management to the
   inspectors, and the broken link between two roles blinks as it passes. The four approaches below are single states and stay
   still. The labels never move. Reduced motion shows the final frame. */
.st-doc { animation: st-lift 6s ease-in-out infinite; }
.st-d2 { animation-delay: 0.6s; }
.st-d3 { animation-delay: 1.2s; }
.st-d4 { animation-delay: 1.8s; }
.st-d5 { animation-delay: 2.4s; }
.st-gap { animation: st-gap 6s linear infinite; }
.st-g1 { animation-delay: 0.3s; }
.st-g2 { animation-delay: 0.9s; }
.st-g3 { animation-delay: 1.5s; }
.st-g4 { animation-delay: 2.1s; }
@keyframes st-lift { 0%, 20%, 100% { transform: none; } 6%, 14% { transform: translateY(-10px); } }
@keyframes st-gap { 0% { opacity: 1; stroke-dashoffset: 0; } 8% { opacity: 0.25; } 16% { opacity: 1; } 20%, 100% { opacity: 1; stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) {
  .st-doc, .st-gap { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
}
</style>
