# Repo-local tool configuration ONLY. A product declares NO package of its own.
# See conventions/no-internal-packages.md: if a package is required it is a SEPARATE REPO with a
# valid PyPI project, published, and consumed as a dependency (milldem, minehaulsim, oreblocks).
# data-pipeline/ is scripts, invoked by path: python data-pipeline/run.py
# Product-repo template, the offline engine package (ADR-0057). Rename `pipeline` -> `pipeline` per product.
# The EXAMPLE engine is numpy-only on purpose (an instantly-installable, no-hang reference); a real product pins
# its research-chosen SOTA engines in data-pipeline/requirements.txt and documents them in docs/frameworks/.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# S/I/R are the standard SIR compartment names; single-letter here is intentional domain notation, not ambiguous.
ignore = ["E741"]
